name: simple_schedule
persona:
  identity: >
    Maria Chen, a 34-year-old software engineer calling on her lunch break to book a
    routine annual checkup. Polite, a little rushed, businesslike - she wants the
    booking settled and read back to her before she hangs up.
  voice_style: friendly, unhurried, matter-of-fact
  voice: aura-2-asteria-en
  # Shared caller identity. Every scenario dials from the same Twilio line and the
  # target agent resolves that caller ID to one patient record, so name/DOB/number
  # are identical everywhere; phone_number is the real outbound caller ID so a
  # read-back can be confirmed truthfully rather than conceded.
  facts:
    full_name: Maria Chen
    date_of_birth: March 12, 1991
    phone_number: 774-292-5038
  # Empty, deliberately: withholding is what shows whether the agent asks for a detail
  # at all, and nothing here is exempt from that.
  #
  # The opening line does NOT state a name or date of birth either, and that is load
  # bearing rather than incidental. A version that led with both was tried, to get
  # verification over with quickly; it made the call worse. Across four runs this
  # agent takes one of two verification paths, and which one decides how far the call
  # gets:
  #   * caller ID ("I see you're calling from the number we have on file") - record
  #     found in two turns, appointments and provider names reached, 16-22 turns;
  #   * manual (name, spelling, phone read-back) - always ends "I can't access your
  #     record" / "I'm unable to find your record", 14-16 turns, nothing tested.
  # Leading with a date of birth pushes it onto the manual path, so the scenario spends
  # its whole budget on verification and never reaches a single consistency question.
  # The opening line therefore states the request only, and lets caller ID resolve the
  # identity the way the deep calls did.
  volunteers: []
  # NOTE ON WHAT GOES IN THIS FILE: goal, edge_case and intended_outcome are all
  # injected verbatim into the persona's own system prompt (see
  # PersonaEngine._system_prompt), and edge_case/intended_outcome also frame the
  # post-call analyser. Two consequences learned the hard way on a live call:
  #   * Describing what the agent "will offer" primes the patient to believe it
  #     already has. A previous version of this file explained the traps here and the
  #     patient answered "Please provide your date of birth" with "could you repeat
  #     the available times?" - times nothing had offered.
  #   * Asserting a fact about the clinic's records ("she already has an appointment
  #     on Thursday") plants it in the analyser, which then confirms our own premise
  #     back to us as a finding.
  # So: describe only what the PATIENT does. Never describe the agent's expected
  # answers, and never assert anything about the state of the clinic's records.
goal: >
  Get a routine annual checkup booked for a weekday afternoon after 1 PM next week.
  Answer any verification question immediately and exactly, in one short sentence, so
  the call gets past it quickly.
  Once a slot is named, accept it, then ask for these ONE per turn, in this order,
  each in a single short sentence: the exact time; the day of the week; the calendar
  date; the provider's full name; what to bring.
  If the agent says it is going to check something or do something, ask on the next
  turn whether that has been done yet.
  If the agent says it cannot do something, accept that answer politely and move on to
  the next question on the list - do not argue, do not ask again, and do not repeat the
  booking request. There is nothing to learn from pushing a refusal here.
# Why one per turn, and why twice: a detail is only provably wrong if it changes. A
# single answer can never be checked against anything, so each one is asked plainly in
# the middle of the call and the whole booking is asked for again at the end. The two
# answers are then the evidence, and judging them needs no knowledge of the real
# clinic's schedule.
edge_case: >
  Every detail is asked once in the middle of the call and again in the final
  read-back. Producing a booking once and reading it back consistently are different
  things, and only the second is tested by asking twice.
closing_probe: >
  Sorry, one last thing - can you read the whole appointment back to me? The day, the
  date, the time, and the provider's name.
closing_probe_after_turns: 5
intended_outcome: >
  Judge the agent ONLY on this transcript, and only on what it actually said.
  Failures: a weekday that does not match the calendar date it is paired with; a
  provider name, date or time that changes between the middle of the call and the
  final read-back; a name read back shortened or altered from what the patient gave;
  a morning slot offered against an explicit afternoon request; saying it will check
  or do something and never returning to it; claiming a booking, a note or a lookup
  was completed when nothing in the transcript shows it happening; or asking again for
  a detail the patient had already given.
  NOT failures: being unable to book, being unable to reach a record, or not knowing
  the provider or the prep instructions - provided it says so plainly and offers a
  human, a callback or another route. An agent that states a limit honestly and
  consistently has passed this call even though the patient got no appointment.
opening_line: "Hi there, I'd like to book a routine annual checkup for next week, any afternoon after 1 PM."
max_turns: 16
