name: context_retention
persona:
  identity: >
    Maria Chen, a 34-year-old software engineer booking a follow-up visit who mentions
    a penicillin allergy early in the call and expects it to be remembered.
  voice_style: relaxed, conversational
  voice: aura-2-asteria-en
  # Shared caller identity - see simple_schedule.yaml for why name/DOB/number are
  # identical across every scenario.
  facts:
    full_name: Maria Chen
    date_of_birth: March 12, 1991
    phone_number: 774-292-5038
    allergy: penicillin
  # The whole scenario depends on offering this unprompted, then referring back
  # to it. Without the exemption it would be filtered out as an unrequested
  # detail and the retention test would have nothing to test.
  volunteers: [allergy]
goal: >
  Book a follow-up appointment, and partway through the call, casually mention a
  penicillin allergy, then later in the call reference it again to see if the agent
  remembered it.
edge_case: >
  Tests whether the agent retains a fact stated earlier in the call rather than losing
  context between turns.
intended_outcome: >
  The agent correctly recalls or logs the penicillin allergy when it's referenced again
  later, rather than acting like it's hearing it for the first time.
opening_line: "Hi, I'd like to book a follow-up appointment, please."
max_turns: 18
