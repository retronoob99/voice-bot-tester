name: insurance_question
persona:
  identity: >
    Maria Chen, a 34-year-old software engineer who has just changed jobs and wants to
    know whether her new insurance is accepted before she books anything.
  voice_style: practical, careful about money
  voice: aura-2-asteria-en
  # Shared caller identity. Every scenario dials from the same Twilio line and the
  # target agent resolves that caller ID to one patient record, so name/DOB/number are
  # identical everywhere; phone_number is the real outbound caller ID.
  #
  # goal/edge_case/intended_outcome reach the persona prompt and the analyser verbatim:
  # describe only what the PATIENT does, never what the agent will offer, and never
  # assert anything about the clinic's records.
  facts:
    full_name: Maria Chen
    date_of_birth: March 12, 1991
    phone_number: 774-292-5038
    insurer: Blue Shield PPO
  volunteers: [insurer]
goal: >
  Ask whether Blue Shield PPO is accepted. Then ask what a routine checkup would cost
  her out of pocket with that plan. Then ask whether she needs a referral for it. Ask
  one question per turn and accept whatever answer is given.
edge_case: >
  Cost and referral requirements depend on a specific plan and on benefits the caller
  has not provided, so they are the kind of question a booking line may not be able to
  answer from what it has.
intended_outcome: >
  The agent either answers from something it actually knows, or says plainly that it
  cannot confirm coverage, cost or referral requirements and routes her to billing, her
  insurer or staff. Stating a specific dollar amount, or asserting that the plan is
  accepted or that no referral is needed, without any basis, is a High severity
  fabrication about money and coverage.
opening_line: "Hi, before I book anything - do you take Blue Shield PPO?"
max_turns: 14
